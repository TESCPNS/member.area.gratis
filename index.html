<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Member Area · tescpns.online</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f6f8fc;--card:#fff;--ink:#0b1a3a;--mute:#5a6785;--line:#e3e9f4;--blue:#1d4ed8;--blue2:#3b82f6;--orange:#f97316;--tint:#edf2ff;--ok:#0f9b6c;--glass:#ffffffcc;--sh:0 1px 2px #0b1a3a0d,0 12px 32px -16px #0b1a3a33;--shh:0 2px 4px #0b1a3a0d,0 28px 48px -20px #1d4ed855;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081022;--card:#101b36;--ink:#eef2fb;--mute:#9aa8c6;--line:#22345a;--blue:#7fb0ff;--blue2:#4f8df5;--orange:#ff9a45;--tint:#182a52;--ok:#3fd4a4;--glass:#081022cc;--sh:0 1px 2px #0006,0 12px 32px -16px #000a;--shh:0 2px 4px #0006,0 28px 48px -20px #4f8df566}}
:root[data-theme="dark"]{--bg:#081022;--card:#101b36;--ink:#eef2fb;--mute:#9aa8c6;--line:#22345a;--blue:#7fb0ff;--blue2:#4f8df5;--orange:#ff9a45;--tint:#182a52;--ok:#3fd4a4;--glass:#081022cc;--sh:0 1px 2px #0006,0 12px 32px -16px #000a;--shh:0 2px 4px #0006,0 28px 48px -20px #4f8df566}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);font:400 16px/1.65 "Plus Jakarta Sans",system-ui,sans-serif;background:radial-gradient(900px 420px at 85% -80px,#3b82f622,transparent 70%),radial-gradient(700px 360px at 0% 0,#f9731614,transparent 70%),var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
header{position:sticky;top:0;z-index:5;background:var(--glass);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px clamp(16px,4vw,44px);min-height:54px}
.logo{font:800 19px "Plus Jakarta Sans",sans-serif;letter-spacing:-.5px;text-decoration:none}
.logo .a{color:var(--blue)}.logo .b{color:var(--orange)}
nav{display:flex;gap:2px;margin-left:10px}
nav a{padding:6px 14px;border-radius:99px;font-size:14px;color:var(--mute);text-decoration:none;font-weight:500;transition:background .2s,color .2s}
nav a:hover{color:var(--ink)}
nav a[aria-current]{background:var(--tint);color:var(--blue);font-weight:600}
.me{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;box-shadow:0 0 0 3px var(--tint)}
.badge{font-size:11.5px;font-weight:700;color:var(--orange);border:1px solid color-mix(in srgb,var(--orange) 45%,transparent);padding:1px 10px;border-radius:99px}
main{max-width:980px;margin:0 auto;padding:clamp(28px,5vw,56px) clamp(16px,4vw,44px) 48px}
.hero{max-width:60ch;margin-bottom:clamp(24px,4vw,40px)}
h1{font:700 clamp(26px,3.6vw,38px)/1.15 "Fraunces",Georgia,serif;letter-spacing:-.5px}
.lead{color:var(--mute);margin-top:10px;font-size:15px}
.tests{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.test{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sh);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,border-color .3s;animation:in .6s cubic-bezier(.2,.8,.2,1) both}
.test:nth-child(2){animation-delay:.1s}
.test::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;border-radius:22px 22px 0 0;background:linear-gradient(90deg,var(--blue),var(--blue2) 60%,var(--orange));opacity:.9}
.test:hover{transform:translateY(-6px);box-shadow:var(--shh);border-color:color-mix(in srgb,var(--blue2) 50%,var(--line))}
.num{width:46px;height:46px;border-radius:14px;background:var(--tint);color:var(--blue);display:grid;place-items:center;font:700 22px "Fraunces",Georgia,serif;transition:background .3s,color .3s,transform .3s}
.test:hover .num{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;transform:rotate(-6deg)}
.test h3{font:700 20px/1.25 "Fraunces",Georgia,serif;letter-spacing:-.2px}
.test p{color:var(--mute);font-size:14.5px;flex:1}
.tags{display:flex;gap:6px}.tags span{font-size:11.5px;font-weight:700;letter-spacing:.3px;color:var(--blue);background:var(--tint);border-radius:99px;padding:2px 11px}
.chip{align-self:flex-start;font-size:12px;font-weight:600;color:var(--mute);display:inline-flex;align-items:center;gap:6px}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--line);box-shadow:inset 0 0 0 1.5px var(--mute)}
.chip.on{color:var(--ok)}.chip.on::before{background:var(--ok);box-shadow:none}
.go{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--card);text-decoration:none;font-weight:600;font-size:15px;border-radius:99px;padding:12px 22px;transition:background .25s,transform .25s}
.go:hover{background:var(--blue)}
.go:hover{color:#fff}
.go span,.cta span{transition:transform .25s}.go:hover span,.cta:hover span{transform:translateX(4px)}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(110deg,#fbbf24,#f97316 45%,#ea580c);background-size:160% 100%;background-position:0 0;color:#fff;text-decoration:none;font-weight:700;font-size:15px;border-radius:99px;padding:12px 24px;box-shadow:0 10px 24px -10px #f97316cc;transition:transform .25s,box-shadow .25s,background-position .5s}
.cta:hover{background-position:100% 0;transform:translateY(-2px);box-shadow:0 16px 30px -10px #f97316e6}
.promo{margin:clamp(32px,5vw,52px) auto 0;width:100%;max-width:520px;border-radius:24px;color:#fff;background:linear-gradient(115deg,#0f1f4d 0%,#1d4ed8 50%,#3b82f6 78%,#f97316 135%);overflow:hidden;box-shadow:var(--shh);padding:6px}
.promo>img{display:block;width:100%;height:auto;border-radius:19px}
.promo .txt{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:16px 16px 12px}
.promo h2{font:700 18px/1.2 "Fraunces",Georgia,serif}
.promo p{color:#d6e4ff;font-size:13.5px;margin-top:2px}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:1200px){.promo{max-width:560px}}
@media (max-width:640px){.promo .txt{flex-direction:column;text-align:center;gap:12px}.promo .cta{width:100%}.tests{grid-template-columns:1fr}}
@media (max-width:560px){header{flex-wrap:wrap;gap:2px 8px}nav{order:3;width:100%;margin:0}.me b{display:none}}
@media (max-width:400px){header{padding-left:12px;padding-right:12px}nav a{padding:5px 10px;font-size:13px}main{padding-left:12px;padding-right:12px}}
</style>
</head>
